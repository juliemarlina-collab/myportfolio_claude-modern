/* ===== Visibility & colour pass (Oct 2026) ===== */
:root{--muted:#17171b;--lav:#eceeff;--mintT:#dcfbf4;--yelT:#fff6bf;--pinkT:#ffe3ef}
body{font-size:18px}
p{max-width:70ch}
/* page headings */
h1{font-size:clamp(46px,6.2vw,88px)}
h2{font-size:clamp(32px,3.9vw,54px)}
h3{font-size:26px}
.page-head{padding:64px 0 36px}
.page-head h1{font-size:clamp(48px,5.8vw,86px);position:relative;padding-bottom:18px}
.page-head h1:after{content:'';position:absolute;left:0;bottom:0;width:120px;height:10px;border-radius:10px;background:var(--accent,var(--blue))}
.page-head .intro{font-size:20px}
.kicker{font-size:13px;color:var(--accent,var(--blue))}
.intro{font-size:20px;color:var(--ink)}
.section-head h2{font-size:clamp(34px,4vw,56px)}
.section-head p{font-size:17px;color:var(--ink)}
.section-label,.compact-label{font-size:13px;color:var(--blue)}
.note{font-size:15px}
.pill{font-size:13px}
.tag{font-size:12px}

/* navigation & footer */
.top-inner{min-height:88px}
.brand{font-size:17px}
.brand i{width:44px;height:44px;font-size:14px}
.top nav a{font-size:clamp(13px,1.02vw,16px);padding:10px 11px}
.top nav a.active{box-shadow:0 4px 0 var(--yellow)}
.lang{font-size:15px;padding:9px 14px}
.footer{padding:46px 0}
.footer b{font-size:19px}
.footer p{font-size:16px;color:#e6e6ea}
.footer a{font-size:16px}
.footer .footer-call{font-size:24px}
.tools button{font-size:14px;color:#fff;padding:9px 15px}

/* body copy: larger, black */
.card p,.story p,.milestone p,.road-stop p,.bio-note p,.project p,.project-stage p,.folder-detail p,.folder-cover p,.mini-list li{font-size:17px;color:var(--ink)}
.card.color p{color:inherit}
.service-band p{font-size:17px;color:#fff}
.pocket-sheet p,.ticket p,.folio-panel .assessed p{font-size:16px}
.pocket-sheet p{color:var(--ink)}
.folder-paper li{font-size:17px}
.mini-list small,.evidence-row small,.empty-inner small{font-size:14px;color:var(--ink)}
.metric-cell span{font-size:15px}.metric-cell small{font-size:13px}
.contact-banner p{font-size:16px}
dialog p{font-size:16px}
.button{font-size:16px;padding:15px 24px}
.text-link{font-size:16px}
.skills span{font-size:15px}
.tabs a{font-size:15px}
.next-section a{font-size:17px}
.next-section small{font-size:12px;color:var(--ink)}
.folio-links b,.folio-panel .folio-links b{font-size:15px}
.folio-links small,.folio-panel .folio-links small{font-size:13px}
.folio-panel .folio-ordinal,.folio-panel .assessed b{font-size:12px}
.folio-panel .bilingual-title{font-size:15px}
.folio-panel .stat-pill{font-size:14px}
.folio-panel h2{font-size:40px}
.folio-toc b{font-size:24px}.folio-toc small{font-size:13px}
.chapter-directory b{font-size:27px}.chapter-directory span{font-size:14px}
.folder h3{font-size:21px}.folder small,.folder .code{font-size:13px}
.ticket .ticket-foot{font-size:12px}
.pocket .pocket-tag{font-size:13px}
/* text on dark sections stays light, not grey */
.hero .intro,.folio-intro p{color:#fff;font-size:18px}
.hero-notes{color:#fff;font-size:13px}

/* ---------- stronger welcome ---------- */
.cover{padding:56px 0 70px;background:#fff;background-image:radial-gradient(#3539df1c 1.4px,transparent 1.4px);background-size:18px 18px;position:relative}
.cover:before{content:'';position:absolute;right:-8vw;top:-10vw;width:46vw;height:46vw;border-radius:50%;background:var(--yelT);z-index:0}
.cover .wrap{position:relative;z-index:1}
.role-ribbon{font-size:14px;padding:13px 20px;box-shadow:4px 4px 0 var(--ink);border:2px solid var(--ink)}
.cover-name{font-size:24px}
.cover h1{font-size:clamp(52px,5.1vw,90px)}
.cover h1 .blue{background:linear-gradient(transparent 62%,var(--yellow) 62% 90%,transparent 90%)}
.cover .intro{font-size:21px;color:var(--ink)}
@media(min-width:1101px){
 .cover-grid{grid-template-columns:1fr 1.05fr;gap:40px}
 .portrait-poster{min-height:760px;margin:10px 0 0}
 .poster-base{inset:30px 26px 18px 40px}
 .poster-portrait{top:70px;width:min(470px,calc(100% - 110px))}
 .poster-portrait .photo{border-width:10px}
 .poster-vertical{font-size:112px;bottom:90px;left:-20px}
 .poster-note{width:240px;padding:28px;bottom:120px;right:-18px}
 .poster-note strong{font-size:46px}
 .poster-note small{font-size:12px}
 .poster-arrow{width:82px;height:82px;font-size:36px}
 .poster-foot{font-size:13px;bottom:46px}
}
@media(min-width:761px) and (max-width:1100px){
 .portrait-poster{min-height:620px}
 .poster-portrait{width:min(380px,calc(100% - 80px))}
 .poster-note strong{font-size:38px}

const DATA=JSON.parse(document.getElementById('portfolio-data').textContent);const initialPhotos=JSON.parse(document.getElementById('photo-data').textContent);let photos={...initialPhotos};let lang='en',editing=false,pendingPhoto='';try{lang=localStorage.getItem('julie-story-lang')||'en';photos={...photos,...JSON.parse(localStorage.getItem('julie-story-photos')||'{}')}}catch{}if(!['en','bm'].includes(lang))lang='en';
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const T=(en,bm)=>lang==='bm'?bm:en;const L=o=>lang==='bm'?(o.bm||o.en):o.en;
const pages=[['welcome','Welcome','Selamat datang'],['profile','About me','Tentang saya'],['journey','My journey','Perjalanan'],['teaching','Teaching','Pengajaran'],['innovation','Innovation','Inovasi'],['leadership','Leadership & service','Kepimpinan'],['growth','Professional growth','Pembangunan diri'],['framework','DH13 folio','Folio DH13']];
function photo(id,en,bm,cls='',slot='#e8e5dd'){const src=photos[id];return `<figure class="photo ${src?'':'empty'} ${cls}" style="--slot:${slot}">${src?`<img src="${E(src)}" alt="${E(T(en,bm))}" loading="lazy" tabindex="0" role="button" aria-label="${E(T('Enlarge image: ','Besarkan imej: ')+T(en,bm))}"><figcaption>${E(T(en,bm))}</figcaption>`:`<div class="empty-inner"><span class="photo-icon" aria-hidden="true">▧</span><b>${E(T(en,bm))}</b><small>${T('A space for a moment from this chapter.','Ruang untuk detik dalam bab ini.')}</small></div>`}<button class="photo-upload" data-photo="${id}" type="button">${T(src?'Replace photo':'Add photo',src?'Tukar foto':'Tambah foto')}</button></figure>`}
function head(kicker,title,desc,accent='var(--blue)'){return `<div class="wrap page-head" style="--accent:${accent}"><div><p class="kicker">${kicker}</p><h1>${title}</h1></div><p class="intro">${desc}</p></div>`}
function card(num,title,body,href,accent='',fg='var(--ink)'){return `<${href?'a':'article'} ${href?`href="${href}"`:''} class="card reveal ${accent?'color':''}" style="--accent:${accent};--fg:${fg}"><span class="num">${num}</span>${href?'<span class="arrow">↗</span>':''}<h3>${title}</h3><p>${body}</p></${href?'a':'article'}>`}
function story(title,body){return `<div class="story reveal"><h3>${title}</h3><p>${body}</p></div>`}
function collage(a,b,c){return `<div class="collage reveal">${a+b+c}</div>`}
function next(id){let i=pages.findIndex(p=>p[0]===id);if(i<0)return `<div class="wrap next-section"><a href="#/framework">← ${T('Back to DH13 folio','Kembali ke folio DH13')}</a></div>`;return `<div class="wrap next-section">${i?`<a href="#/${pages[i-1][0]}"><small>${T('Previous chapter','Bab terdahulu')}</small>← ${pages[i-1][lang==='bm'?2:1]}</a>`:'<span></span>'}<a href="#/${pages[(i+1)%pages.length][0]}"><small>${T(i===7?'Return to':'Next chapter',i===7?'Kembali ke':'Bab seterusnya')}</small>${pages[(i+1)%pages.length][lang==='bm'?2:1]} →</a></div>`}

function teaching(){const courses=[['DUE50132','Communicative English 3',T('Job advertisements, application documents and interview practice connect English with the next stage of a learner’s life.','Iklan jawatan, dokumen permohonan dan latihan temu duga menghubungkan Bahasa Inggeris dengan fasa seterusnya kehidupan pelajar.'),T('Career-ready communication','Komunikasi untuk kerjaya'),'#ece4ff','#3539df','white','-4deg'],['DUE10062','Technical English 1',T('Enquiries, technical situations and workplace safety discussions give language learning an authentic context.','Pertanyaan, situasi teknikal dan perbincangan keselamatan tempat kerja memberi konteks sebenar kepada pembelajaran bahasa.'),T('English in action','Bahasa dalam tindakan'),'#fff4a7','#ffdc00','#17171b','3deg'],['DUE30022','Communicative English 2',T('Products and services become a starting point for explaining, discussing and communicating ideas clearly.','Produk dan perkhidmatan menjadi titik permulaan untuk menerang, berbincang dan menyampaikan idea dengan jelas.'),T('Confidence through practice','Keyakinan melalui latihan'),'#f7def3','#ff3487','#17171b','-3deg']];return head('03 · '+T('Teaching & learning','Pengajaran & pembelajaran'),T('Learning that<br>leaves the page.','Pembelajaran yang<br>melampaui halaman.'),T('Practical tasks, purposeful interaction and digital resources help me bring English into situations that matter to students.','Tugasan praktikal, interaksi bertujuan dan sumber digital membantu saya membawa Bahasa Inggeris ke dalam situasi yang bermakna kepada pelajar.'))+`<div class="wrap section"><div class="pocket-grid">${courses.map(c=>`<article class="pocket reveal" style="--accent:${c[4]};--front:${c[5]};--fg:${c[6]};--tilt:${c[7]}"><span class="pocket-tag">${c[0]}</span><div class="pocket-sheet"><span class="tag">${T('Inside the classroom','Dalam bilik darjah')}</span><h3>${c[1]}</h3><p>${c[2]}</p></div><div class="pocket-front">${c[3]}<i aria-hidden="true">✳</i></div></article>` v>${collage(photo('growth-main','Learning alongside other educators','Belajar bersama pendidik lain'),photo('growth-training','Training & facilitation','Latihan & fasilitasi','','#e9dcfa'),photo('growth-reflection','Reflecting on practice','Merefleksi amalan','','#daf2e7'))}</div><div class="wrap section"><blockquote class="quote">${T('“My next step is to connect what I build with clearer evidence of how it supports learning.”','“Langkah seterusnya ialah menghubungkan hasil yang saya bina dengan bukti yang lebih jelas tentang sokongannya kepada pembelajaran.”')}<small>${T('Professional direction · towards DH13','Hala tuju profesional · ke arah DH13')}</small></blockquote></div>`}

function framework(){return `<section class="folio-intro"><div class="wrap folio-intro-grid"><div><p class="kicker">${T('Promotion portfolio','Folio pemangkuan')} · DH12 → DH13</p><h1>Julie<br><em>Marlina</em><br>binti Hasan.</h1><p>${T('Senior Lecturer, English Language Unit, General Studies Department, Politeknik Port Dickson. Educator, trainer and digital learning creator.','Pensyarah Kanan, Unit Bahasa Inggeris, Jabatan Pengajian Am, Politeknik Port Dickson. Pendidik, jurulatih dan pencipta pembelajaran digital.')}</p><span class="pill">${T('Category I(a)','Kategori I(a)')}</span><span class="pill">DH12 · 05.02.2024</span><br><span class="pill">HRD Corp Accredited Trainer</span></div><div><p class="kicker">${T('Contents','Kandungan')} · 06</p><div class="folio-toc"><button data-jump="folio-facts" style="--accent:white;--fg:#17171b"><small>00</small><b>${T('At a glance','Fakta ringkas')}</b><span>→</span></button>${DATA.framework.map((f,i)=>`<button data-jump="criterion-${i}" style="--accent:${f.c};--fg:${f.t}"><small>0${i+1}</small><b>${E(L(f))}</b><span>→</span></button>`).join('')}</div></div></div></section><div class="wrap section folio-stats" id="folio-facts"><div class="section-head"><h2>${T('At a glance.','Sekilas tentang saya.')}</h2><p>${T('Career highlights from the supplied framework. Earlier work is retained as professional background.','Sorotan kerjaya daripada kerangka. Kerja terdahulu dikekalkan sebagai latar profesional.')}</p></div>${statsBento()}</div><div class="wrap section"><div class="section-head"><h2>${T('The work that<br>builds my journey.','Bukti yang<br>membina laluan.')}</h2><p>${T('Five areas of contribution. Scroll through the chapters, or open the story behind each one.','Lima bidang sumbangan. Tatal setiap bab atau buka kisah di sebaliknya.')}</p></div><div class="folio-stack">${DATA.framework.map((f,i)=>`<article id="criterion-${i}" class="folio-panel" style="--accent:${f.c};--fg:${f.t};--index:${i}"><div><div class="big-num">0${i+1}</div><p class="folio-ordinal">${T('Criterion','Kriteria')} ${i+1} / 5</p><h2>${E(L(f))}</h2><p class="bilingual-title">${E(lang==='bm'?f.en:f.bm)}</p><div class="assessed"><b>${T('Area of contribution','Bidang sumbangan')}</b><p>${T(...assessmentCopy[i])}</p></div><span class="stat-pill"><b>${i===0?'16+':i===1?'V2':i===2?'2026':i===3?'2027':'3'}</b>${T(['teaching hours/week · supplied framework','Smart MUET Guide','institutional & academic roles','HRD Corp valid until','institutional · national · international'][i],['jam PdP/minggu · kerangka dibekalkan','Smart MUET Guide','peranan institusi & akademik','tempoh sah HRD Corp hingga','institusi · kebangsaan · antarabangsa'][i])}</span><br><a class="story-link" href="#/${['teaching','innovation','leadership','growth','leadership'][i]}">${T('Read the story','Baca kisahnya')} →</a></div><ul class="folio-links">${f.items.filter(it=>!it.pending).map(it=>`<li><span class="year">${E(it.y)}</span><span><b>${E(it.h)}</b><small>${E(it.r)}${it.pre?' · '+T('before current grade','sebelum gred semasa'):''}</small></span>${it.u?`<button data-document="${E(it.u)}" data-title="${E(it.h)}" aria-label="${E(T('Open: ','Buka: ')+it.h)}">↗</button>`:''}</li>`).join('')}</ul></article>`).join('')}</div></div><aside class="stack-dots" aria-label="${T('Jump to criterion','Lompat ke kriteria')}">${DATA.framework.map((f,i)=>`<button data-jump="criterion-${i}" aria-label="${E(L(f))}"></button>`).join('')}</aside><div class="wrap section"><div class="folder-stage"><div class="section-head"><h2>${T('The supporting folders.','Folder sokongan.')}</h2><p>${T('Eight places for the formal records. Add the evidence when you are ready.','Lapan ruang rekod formal. Tambah bukti apabila sedia.')}</p></div>${folderCards()}</div><div class="actions"><a class="button outline" href="#/evidence">${T('Browse existing document links','Semak pautan dokumen sedia ada')} ↗</a></div><p class="note">${T('Framework mapping follows the supplied materials. Linked records do not establish verified eligibility or completed outcomes.','Pemetaan mengikut bahan dibekalkan. Rekod dipaut tidak mengesahkan kelayakan atau hasil yang telah lengkap.')}</p></div>`}
function folder(code){const i=DATA.folders.findIndex(f=>f.code===code);if(i<0)return folders();const f=DATA.folders[i];return `<div class="wrap"><div class="tabs" style="margin-top:25px">${DATA.folders.map(x=>`<a class="${x.code===code?'active':''}" href="#/folder/${x.code}">${x.code} ·${E(L(x))}</a>`).join('')}</div><header class="folder-cover" style="--accent:${f.c};--fg:${f.t}"><div class="folder-number">${f.code}</div><div><p class="kicker">${T('Supporting folder','Folder sokongan')} ${i+1} / 8</p><h1>${E(L(f))}</h1><p>${T(...checklist[i])}</p></div></header><div class="section grid2"><article class="folder-paper"><p class="tag">${T('Inside this folder','Dalam folder ini')}</p><h3>${T('A clear place for every record.','Tempat yang jelas bagi setiap rekod.')}</h3><ul><li>${T(...checklist[i])}</li><li>${T('Include document title, date and a short description.','Sertakan tajuk, tarikh dan penerangan ringkas.')}</li><li>${T('Connect the record to your role and the relevant criterion.','Hubungkan rekod dengan peranan dan kriteria berkaitan.')}</li></ul>${f.u?`<button class="button" data-document="${E(f.u)}" data-title="${E(L(f))}">${T('Open existing record','Buka rekod sedia ada')} ↗</button>`:`<p class="note">${T('Ready for documents to be added later.','Sedia untuk dokumen ditambah kemudian.')}</p>`}</article><article class="folder-detail"><h3>${T('Connected to the story.','Berkaitan dengan perjalanan.')}</h3><p>${T('The narrative pages present your work and professional growth. This folder holds the supporting details when you are ready to include them.','Halaman naratif memaparkan kerja dan perkembangan profesional anda. Folder ini menempatkan butiran sokongan apabila sedia dimasukkan.')}</p><div class="actions"><a class="button outline" href="#/${['profile','framework','growth','journey','leadership','framework','teaching','profile'][i]}">${T('Explore the related chapter','Terokai bab berkaitan')} ↗</a></div></article></div><div class="actions"><a class="button" href="#/${i<7?'folder/'+DATA.folders[i+1].code:'framework'}">${T(i<7?'Next folder':'Back to DH13 folio',i<7?'Folder seterusnya':'Kembali ke folio DH13')} →</a></div></div>`}
let stackFrame=false;function updateStacks(){stackFrame=false;const cards=[...document.querySelectorAll('.folio-panel')];const dots=document.querySelector('.stack-dots');if(!cards.length)return;const enabled=innerWidth>760&&innerHeight>740&&!matchMedia('(prefers-reduced-motion: reduce)').matches;const box=document.querySelector('.folio-stack').getBoundingClientRect();if(dots)dots.classList.toggle('show',enabled&&box.top<innerHeight*.55&&box.bottom>innerHeight*.45);let active=0;cards.forEach((c,i)=>{if(c.getBoundingClientRect().top<innerHeight*.5)active=i;const next=cards[i+1];if(!enabled||!next){c.style.transform='';c.style.filter='';return}const end=100+(i+1)*9;const progress=Math.max(0,Math.min(1,(innerHeight-next.getBoundingClientRect().top)/(innerHeight-end)));c.style.transform=`scale(${1-progress*.045})`;c.style.filter=`brightness(${1-progress*.08})`});document.querySelectorAll('.stack-dots button').forEach((b,i)=>{b.classList.toggle('active',i===active);b.setAttribute('aria-pressed',String(i===active))})}
function scheduleStacks(){if(!stackFrame){stackFrame=true;requestAnimationFrame(updateStacks)}}addEventListener('scroll',scheduleStacks,{passive:true});addEventListener('resize',scheduleStacks);document.addEventListener('click',e=>{const jump=e.target.closest('[data-jump]');if(jump){document.getElementById(jump.dataset.jump)?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})}const img=e.target.closest('.photo img');if(img){const dialog=document.getElementById('photo-lightbox');document.getElementById('lightbox-image').src=img.src;document.getElementById('lightbox-image').alt=img.alt;document.getElementById('lightbox-caption').textContent=img.alt;dialog.showModal()}});document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.photo img')){e.preventDefault();e.target.click()}});document.getElementById('close-lightbox').onclick=()=>document.getElementById('photo-lightbox').close();

let observer;function route(){const old={about:'profile',home:'welcome',folios:'framework',pdp:'teaching',tl:'teaching',rdci:'innovation',lead:'leadership',sumb:'leadership',diri:'growth',requirements:'folders'};let parts=HASH.replace(/^#\/?/,'').split('/');let id=old[parts[0]]||parts[0]||'welcome';if(/^R[1-8]$/.test(id)){parts[1]=id;id='folder'}const renderers={welcome,profile,journey,teaching,innovation,leadership,growth,framework,folders,evidence};if(!renderers[id]&&id!=='folder')id='welcome';document.documentElement.lang=lang==='bm'?'ms':'en';document.getElementById('nav').innerHTML=pages.map(p=>`<a href="#/${p[0]}" class="${p[0]===id?'active':''}" ${p[0]===id?'aria-current="page"':''}>${p[lang==='bm'?2:1]}</a>`).join('');document.getElementById('language').textContent=lang==='en'?'BM':'EN';document.getElementById('edit-photos').textContent=T(editing?'Finish editing':'Edit photos',editing?'Selesai menyunting':'Sunting foto');document.getElementById('export').textContent=T('Download portfolio','Muat turun portfolio');document.getElementById('edit-notice').textContent=T('Photo editing is on. Add your own photos, then download the portfolio to keep and share them.','Suntingan foto diaktifkan. Tambah foto sendiri, kemudian muat turun portfolio untuk menyimpan dan berkongsinya.');document.body.classList.toggle('editing',editing);document.getElementById('main').innerHTML=`<div class="page in">${id==='folder'?folder(parts[1]):renderers[id]()}${next(id)}</div>`;document.title=(pages.find(p=>p[0]===id)?.[lang==='bm'?2:1]||T('Portfolio','Portfolio'))+' · Julie Marlina';renderEvidence();if(observer)observer.disconnect();if(!matchMedia('(prefers-reduced-motion: reduce)').matches&&'IntersectionObserver' in window){document.body.classList.add('animate');observer=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');observer.unobserve(e.target)}}),{threshold:.08});document.querySelectorAll('.reveal').forEach(el=>observer.observe(el))}scrollTo(0,0);scheduleStacks();}
let HASH=location.hash;function go(h){HASH=h;try{history.pushState(null,'',h)}catch(_){try{location.hash=h}catch(__){}}route()}document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#/"]');if(!a||e.defaultPrevented||e.metaKey||e.ctrlKey||e.shiftKey||e.button)return;e.preventDefault();go(a.getAttribute('href'))},true);addEventListener('popstate',()=>{HASH=location.hash;route()});addEventListener('hashchange',()=>{if(location.hash!==HASH){HASH=location.hash;route()}});document.getElementById('language').addEventListener('click',()=>{lang=lang==='en'?'bm':'en';try{localStorage.setItem('julie-story-lang',lang)}catch{}route()});document.getElementById('edit-photos').addEventListener('click',()=>{editing=!editing;const y=scrollY;route();scrollTo(0,y)});document.addEventListener('input',e=>{if(e.target.id==='evidence-search')renderEvidence()});document.addEventListener('click',e=>{const image=e.target.closest('[data-photo]');if(image){pendingPhoto=image.dataset.photo;document.getElementById('photo-file').click()}const doc=e.target.closest('[data-document]');if(doc){const match=doc.dataset.document.match(/\/file\/d\/([\w-]+)/);if(!match)return;document.getElementById('document-title').textContent=doc.dataset.title;document.getElementById('document-link').href=doc.dataset.document;document.getElementById('document-frame').src='https://drive.google.com/file/d/'+match[1]+'/preview';document.getElementById('document-dialog').showModal()}});document.getElementById('close-dialog').onclick=()=>document.getElementById('document-dialog').close();document.getElementById('document-dialog').addEventListener('close',()=>document.getElementById('document-frame').src='about:blank');
document.getElementById('photo-file').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const bitmap=await createImageBitmap(file);const scale=Math.min(1,1600/Math.max(bitmap.width,bitmap.height));const canvas=document.createElement('canvas');canvas.width=bitmap.width*scale;canvas.height=bitmap.height*scale;canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);photos[pendingPhoto]=canvas.toDataURL('image/jpeg',.86);bitmap.close();try{localStorage.setItem('julie-story-photos',JSON.stringify(photos))}catch{alert(T('Your photo is ready. Download the portfolio now to keep it; browser storage is full.','Foto sedia. Muat turun portfolio untuk menyimpannya; storan pelayar penuh.'))}const y=scrollY;route();scrollTo(0,y)}catch{alert(T('Please choose a supported image such as JPEG or PNG.','Sila pilih imej seperti JPEG atau PNG.'))}e.target.value=''});
document.getElementById('export').addEventListener('click',()=>{const clone=document.documentElement.cloneNode(true);clone.querySelector('#photo-data').textContent=JSON.stringify(photos).replace(/</g,'\\u003c');clone.querySelector('#main').innerHTML='';clone.querySelector('#nav').innerHTML='';clone.querySelector('#document-frame').src='about:blank';clone.querySelector('body').classList.remove('editing','animate');clone.querySelector('#document-dialog').removeAttribute('open');clone.querySelector('#photo-lightbox').removeAttribute('open');clone.querySelector('#lightbox-image').removeAttribute('src');const url=URL.createObjectURL(new Blob(['<!doctype html>\n'+clone.outerHTML],{type:'text/html'}));const a=document.createElement('a');a.href=url;a.download='index.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});route();
